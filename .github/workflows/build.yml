name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        java: ['21', '25']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B -ntp clean verify
      - if: matrix.java == '21'
        run: |
          jar tf target/nasa-redis-spring-boot-aot-2.0.2.jar | grep -F META-INF/spring/aot.factories
          jar tf target/nasa-redis-spring-boot-aot-2.0.2.jar | grep -F META-INF/native-image/io.github.nasa-runtime/nasa-redis-spring-boot-aot/native-image.properties
          jar tf target/nasa-redis-spring-boot-aot-2.0.2.jar | grep -F META-INF/README.md
          jar tf target/nasa-redis-spring-boot-aot-2.0.2.jar | grep -F META-INF/LICENSE
          test -f target/nasa-redis-spring-boot-aot-2.0.2-sources.jar
          test -f target/nasa-redis-spring-boot-aot-2.0.2-javadoc.jar
